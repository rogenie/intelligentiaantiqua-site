  <text x="28" y="116" fill="#1c1612" font-family="Georgia, serif" font-size="13">Today’s statutory</text>
  <text x="28" y="136" fill="#1c1612" font-family="Georgia, serif" font-size="13">AI, renamed for</text>
  <text x="28" y="156" fill="#1c1612" font-family="Georgia, serif" font-size="13">federal agencies.</text>
  <rect x="182" y="48" width="156" height="150" fill="#f4efe6" stroke="#241e18"/>
  <text x="194" y="84" fill="#6b3a24" font-family="Georgia, serif" font-size="14">Research word</text>
