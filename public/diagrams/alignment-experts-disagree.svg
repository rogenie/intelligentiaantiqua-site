<svg xmlns="http://www.w3.org/2000/svg" width="520" height="280" viewBox="0 0 520 280">
  <rect width="520" height="280" fill="#fbf7f0"/>
  <text x="24" y="40" fill="#1c1612" font-family="Georgia, serif" font-size="16">Loss of control, in the 2026 report</text>
  <rect x="24" y="64" width="220" height="130" fill="#f4efe6" stroke="#241e18"/>
  <text x="40" y="100" fill="#6b3a24" font-family="Georgia, serif" font-size="15">Some experts</text>
  <text x="40" y="130" fill="#1c1612" font-family="Georgia, serif" font-size="14">Severe outcomes</text>
  <text x="40" y="152" fill="#1c1612" font-family="Georgia, serif" font-size="14">merit attention.</text>
  <rect x="276" y="64" width="220" height="130" fill="#f4efe6" stroke="#241e18"/>
  <text x="292" y="100" fill="#6b3a24" font-family="Georgia, serif" font-size="15">Other experts</text>
  <text x="292" y="130" fill="#1c1612" font-family="Georgia, serif" font-size="14">Those scenarios</text>
  <text x="292" y="152" fill="#1c1612" font-family="Georgia, serif" font-size="14">are implausible.</text>
  <text x="24" y="232" fill="#4a433c" font-family="Georgia, serif" font-size="14">The page records the split. It does not close it.</text>
