<svg xmlns="http://www.w3.org/2000/svg" width="520" height="280" viewBox="0 0 520 280">
  <rect width="520" height="280" fill="#fbf7f0"/>
  <text x="24" y="36" fill="#6b3a24" font-family="Georgia, serif" font-size="16">Vague input</text>
  <rect x="24" y="52" width="140" height="64" fill="#f4efe6" stroke="#241e18"/>
  <text x="44" y="90" fill="#1c1612" font-family="Georgia, serif" font-size="16">help me</text>
  <path d="M172 84 H200" stroke="#6b3a24" stroke-width="3"/>
  <rect x="208" y="52" width="250" height="64" fill="#f8ebe4" stroke="#8a341f"/>
  <text x="224" y="80" fill="#1c1612" font-family="Georgia, serif" font-size="14">The machine invents</text>
  <text x="224" y="100" fill="#1c1612" font-family="Georgia, serif" font-size="14">the job and the reader.</text>
  <text x="24" y="160" fill="#1d4a38" font-family="Georgia, serif" font-size="16">Named input</text>
  <rect x="24" y="176" width="200" height="72" fill="#f4efe6" stroke="#1d4a38"/>
  <text x="36" y="206" fill="#1c1612" font-family="Georgia, serif" font-size="13">Four sentences, for a parent,</text>
  <text x="36" y="226" fill="#1c1612" font-family="Georgia, serif" font-size="13">about this public notice.</text>
  <path d="M232 212 H260" stroke="#6b3a24" stroke-width="3"/>
  <rect x="268" y="176" width="228" height="72" fill="#e7efe9" stroke="#1d4a38"/>
  <text x="284" y="208" fill="#1c1612" font-family="Georgia, serif" font-size="14">The job is in the</text>
  <text x="284" y="228" fill="#1c1612" font-family="Georgia, serif" font-size="14">input, still unchecked.</text>
</svg>
