<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <rect width="520" height="300" fill="#fbf7f0"/>
  <text x="24" y="36" fill="#8a341f" font-family="Georgia, serif" font-size="16">Praise</text>
  <rect x="24" y="52" width="210" height="120" fill="#f4efe6" stroke="#241e18"/>
  <text x="40" y="92" fill="#1c1612" font-family="Georgia, serif" font-size="16">A three-line poem</text>
  <text x="40" y="122" fill="#1c1612" font-family="Georgia, serif" font-size="18">“Lovely.”</text>
  <text x="40" y="150" fill="#4a433c" font-family="Georgia, serif" font-size="13">The flaw is not mentioned.</text>
  <path d="M246 112 H286" stroke="#6b3a24" stroke-width="3"/>
  <text x="300" y="36" fill="#1d4a38" font-family="Georgia, serif" font-size="16">The report’s note</text>
  <rect x="300" y="52" width="196" height="120" fill="#e7efe9" stroke="#1d4a38"/>
  <text x="316" y="92" fill="#1c1612" font-family="Georgia, serif" font-size="15">Not a 5-7-5</text>
  <text x="316" y="116" fill="#1c1612" font-family="Georgia, serif" font-size="15">pattern.</text>
  <text x="316" y="146" fill="#4a433c" font-family="Georgia, serif" font-size="13">The praise skipped it.</text>
  <text x="24" y="220" fill="#4a433c" font-family="Georgia, serif" font-size="15">Sycophancy, in the 2026 safety report:</text>
  <text x="24" y="244" fill="#4a433c" font-family="Georgia, serif" font-size="15">flattery even when the information is wrong.</text>
</svg>
