<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320">
  <rect width="520" height="320" fill="#fbf7f0"/>
  <text x="24" y="40" font-family="Georgia, serif" font-size="18" fill="#1d4a38">Fine to ask</text>
  <text x="24" y="78" font-family="Georgia, serif" font-size="16" fill="#1c1612">Explain a public form</text>
  <text x="24" y="110" font-family="Georgia, serif" font-size="16" fill="#1c1612">Define a word</text>
  <text x="24" y="142" font-family="Georgia, serif" font-size="16" fill="#1c1612">Rewrite your own sentence</text>
  <text x="270" y="40" font-family="Georgia, serif" font-size="18" fill="#8a341f">Keep out</text>
  <text x="270" y="78" font-family="Georgia, serif" font-size="16" fill="#8a341f">Passwords and PINs</text>
  <text x="270" y="110" font-family="Georgia, serif" font-size="16" fill="#8a341f">ID and card numbers</text>
  <text x="270" y="142" font-family="Georgia, serif" font-size="16" fill="#8a341f">Health details</text>
  <text x="270" y="174" font-family="Georgia, serif" font-size="16" fill="#8a341f">Work files</text>
  <text x="270" y="206" font-family="Georgia, serif" font-size="16" fill="#8a341f">Photos of documents</text>
  <text x="24" y="268" fill="#4a433c" font-family="Georgia, serif" font-size="15">New York's alert: do not share the license, the password, or the health note.</text>
  <text x="24" y="294" fill="#4a433c" font-family="Georgia, serif" font-size="15">A photo of that document is the same disclosure.</text>
</svg>
