<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <rect width="520" height="300" fill="#fbf7f0"/>
  <text x="24" y="40" font-family="Georgia, serif" font-size="18" fill="#1d4a38">Fine to ask</text>
  <text x="24" y="80" font-family="Georgia, serif" font-size="16" fill="#1c1612">Explain a public form</text>
  <text x="24" y="110" font-family="Georgia, serif" font-size="16" fill="#1c1612">Rewrite my own sentence</text>
  <text x="24" y="140" font-family="Georgia, serif" font-size="16" fill="#1c1612">Define a word</text>
  <text x="280" y="40" font-family="Georgia, serif" font-size="18" fill="#8a341f">Leave out</text>
  <text x="280" y="80" font-family="Georgia, serif" font-size="16" fill="#8a341f">Passwords</text>
  <text x="280" y="110" font-family="Georgia, serif" font-size="16" fill="#8a341f">Account numbers</text>
  <text x="280" y="140" font-family="Georgia, serif" font-size="16" fill="#8a341f">Medical records</text>
  <text x="280" y="170" font-family="Georgia, serif" font-size="16" fill="#8a341f">Someone else's messages</text>
  <text x="24" y="240" fill="#4a433c" font-family="Georgia, serif" font-size="15">The NCSC rule for builders: do not reveal sensitive data to the wrong party.</text>
</svg>
