<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#f4efe6"/>
  <rect x="24" y="24" width="752" height="402" fill="none" stroke="#241e18" stroke-width="2"/>
  <text x="48" y="78" fill="#6b3a24" font-family="Palatino, Georgia, serif" font-size="22">A thin brief</text>
  <rect x="48" y="100" width="280" height="150" fill="#fbf7f0" stroke="#241e18" stroke-width="2"/>
  <text x="68" y="170" fill="#1c1612" font-family="Palatino, Georgia, serif" font-size="28">help me</text>
  <text x="68" y="210" fill="#4a433c" font-family="Palatino, Georgia, serif" font-size="18">The job is missing.</text>
  <text x="400" y="78" fill="#6b3a24" font-family="Palatino, Georgia, serif" font-size="22">A brief</text>
  <rect x="400" y="100" width="340" height="150" fill="#fbf7f0" stroke="#1d4a38" stroke-width="2"/>
  <text x="420" y="145" fill="#1c1612" font-family="Palatino, Georgia, serif" font-size="18">Four sentences.</text>
  <text x="420" y="178" fill="#1c1612" font-family="Palatino, Georgia, serif" font-size="18">For a parent.</text>
  <text x="420" y="211" fill="#1c1612" font-family="Palatino, Georgia, serif" font-size="18">About this public notice.</text>
  <text x="48" y="320" fill="#1c1612" font-family="Palatino, Georgia, serif" font-size="28">The input is the whole brief.</text>
  <text x="48" y="365" fill="#4a433c" font-family="Palatino, Georgia, serif" font-size="20">A smoother reply is not a truer one.</text>
</svg>
