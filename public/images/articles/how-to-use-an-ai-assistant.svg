<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#f4efe6"/>
  <rect x="24" y="24" width="752" height="402" fill="none" stroke="#241e18" stroke-width="2"/>
  <rect x="48" y="70" width="300" height="200" fill="#fbf7f0" stroke="#241e18" stroke-width="2"/>
  <text x="68" y="110" fill="#1d4a38" font-family="Palatino, Georgia, serif" font-size="20">Ask about a public page</text>
  <text x="68" y="160" fill="#8a341f" font-family="Palatino, Georgia, serif" font-size="20" text-decoration="line-through">password</text>
  <text x="68" y="200" fill="#8a341f" font-family="Palatino, Georgia, serif" font-size="20" text-decoration="line-through">medical record</text>
  <path d="M370 160 H450" stroke="#6b3a24" stroke-width="3"/>
  <rect x="460" y="90" width="280" height="160" fill="#fbf7f0" stroke="#241e18" stroke-width="2"/>
  <text x="480" y="140" fill="#1c1612" font-family="Palatino, Georgia, serif" font-size="22">Reply, then a source</text>
  <text x="480" y="190" fill="#4a433c" font-family="Palatino, Georgia, serif" font-size="18">Keep the claim only if</text>
